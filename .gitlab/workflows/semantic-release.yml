semantic-release:
  stage: release
  tags:
    - compiler
  interruptible: true
  image:
    name: ${HARBOR_HOST}/${HARBOR_PROJECT}/lib/node:22.11.0
  script:
    - >
      npx
      --package @semantic-release/gitlab@13.2.1
      --package conventional-changelog-conventionalcommits@8.0.0
      --package semantic-release@24.2.0
      semantic-release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push" && $GITLAB_TOKEN != null
