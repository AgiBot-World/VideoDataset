ci:
  cache:
    - key: pre-commit
      paths:
        - $PRE_COMMIT_HOME
    - key: build
      paths:
        - $HOME/.conan2
  interruptible: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - make prerequisites
    - make dev-test pre-commit test-run build
  tags:
    - genie-gpu-4090-k8s
  stage: ci
  variables:
    PRE_COMMIT_HOME: $CI_PROJECT_DIR/.cache/.pre-commit
pages:
  artifacts:
    paths:
      - public/
  interruptible: true
  rules:
    - if: |
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH ||
        $CI_COMMIT_TAG
      exists:
        - docs/conf.py
  script:
    - make docs-prepare docs-generate BUILDDIR=public/
  tags:
    - genie-gpu-4090-k8s
  stage: ci
