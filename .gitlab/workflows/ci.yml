ci:
  cache:
    paths:
      - .benchmarks
  interruptible: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - make prerequisites
    - make dev-test pre-commit test-run build
    - |
      status=0
      make benchmark || status=$?
      [[ $status -ne 0 ]] && make benchmark-clean
      make benchmark-histogram
      make benchmark-keep
      exit $status
  tags:
    - genie-gpu-4090-k8s
  stage: ci
benchmark-reset:
  cache:
    paths:
      - .benchmarks
  when: manual
  interruptible: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - rm .benchmarks -rf
  tags:
    - genie-gpu-4090-k8s
  stage: ci
