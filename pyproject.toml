[build-system]
build-backend = "scikit_build_core.build"
requires = [ "conan~=2.17.0", "pybind11-stubgen", "scikit-build-core" ]

[project]
name = "videodataset"
description = "Video Dataset with NvCodec."
readme = "README.md"
keywords = [ "dataset", "nvcodec", "video" ]
license = { text = "MIT" }
authors = [ { email = "genie@agibot.com", name = "genie" } ]
requires-python = ">=3.10"
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "numpy",
  "pillow>=10.4",
  "scipy",
  "torch>=2.5",
  "torchvision>=0.20",
]
optional-dependencies.lerobot = [
  "lerobot @ git+https://github.com/huggingface/lerobot.git@dfb1571b",
]
urls.changelog = "https://code.agibot.com/ai-platform/videodataset/-/releases"
urls.issue = "https://code.agibot.com/ai-platform/videodataset/-/issues"
urls.repository = "https://code.agibot.com/ai-platform/videodataset"

[dependency-groups]
dev = [
  "sphinx-autobuild>=2024.10.3",
]
test = [
  "pytest>=6",
  "pytest-benchmark[histogram]",
  "pytest-cov>=3",
  "scikit-image>=0.25.2",
]
docs = [
  "furo>=2023.8.17",
  "myst-parser>=0.13",
  "sphinx>=7",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
]

[tool.pdm]
distribution = true
use_venv = false

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.scikit-build]
minimum-version = "0.9"
build-dir = "build/{wheel_tag}"
cmake.verbose = false
logging.level = "DEBUG"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = [ "src/videodataset/_decoder.pyi" ]

[tool.scikit-build.cmake.define]
BUILD_TESTING = "OFF"
CMAKE_BUILD_TYPE = "Release"

[tool.cibuildwheel]
build-verbosity = 1
skip = [ "pp*", "*win*" ]
test-command = "pytest {project}/tests"
test-extras = [ "test" ]
test-skip = [ "*-win_arm64", "*-macosx_arm64" ]

[[tool.cibuildwheel.overrides]]
select = "*-macos*"
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }

[tool.ruff]
src = [ "src" ]
lint.extend-select = [
  "ARG", # flake8-unused-arguments
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "EM",  # flake8-errmsg
  "EXE", # flake8-executable
  "G",   # flake8-logging-format
  "I",   # isort
  "ICN", # flake8-import-conventions
  "NPY", # NumPy specific rules
  "PD",  # pandas-vet
  "PGH", # pygrep-hooks
  "PIE", # flake8-pie
  "PL",  # pylint
  "PT",  # flake8-pytest-style
  "PTH", # flake8-use-pathlib
  "RET", # flake8-return
  "RUF", # Ruff-specific
  "SIM", # flake8-simplify
  "T20", # flake8-print
  "UP",  # pyupgrade
  "YTT", # flake8-2020
]
lint.ignore = [
  "ISC001",  # Conflicts with formatter
  "PGH003",  # type ignore
  "PLR09",   # Too many <...>
  "PLR2004", # Magic value used in comparison
]
lint.per-file-ignores."src/videodataset/_decoder.pyi" = [ "F821" ]
# Uncomment if using a _compat.typing backport
# typing-modules = ["videodataset._compat.typing"]
lint.per-file-ignores."tests/**" = [ "T20" ]
lint.isort.required-imports = [ "from __future__ import annotations" ]

[tool.codespell]
write-changes = true
check-filenames = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
  "-ra",
  "--durations=0",
  "--showlocals",
  "--strict-markers",
  "--strict-config",
  "--benchmark-skip",
]
xfail_strict = true
filterwarnings = [ "error" ]
log_cli_level = "INFO"
testpaths = [ "tests" ]

[tool.coverage]
run.source = [ "videodataset" ]
report.exclude_also = [ '\.\.\.', 'if typing.TYPE_CHECKING:' ]

[tool.mypy]
disable_error_code = [
  "import-untyped",
  "operator",
  "assignment",
  "name-defined",
]
exclude = [ "src/videodataset/_decoder.pyi" ]

[[tool.mypy.overrides]]
module = "videodataset.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
