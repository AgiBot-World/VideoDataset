[build-system]
requires = ["scikit-build-core", "conan~=2.17.0"]
build-backend = "scikit_build_core.build"

[project]
name = "videodataset"
description = "Video Dataset with NvCodec."
readme = "README.md"
license = { text = "MIT" }
authors = [{ email = "genie@agibot.com", name = "genie" }]
requires-python = ">=3.10"
classifiers = [
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = ["numpy~=1.23.0"]

[project.optional-dependencies]
test = ["pytest >=6", "pytest-cov >=3", "pytest-benchmark[histogram]"]
docs = [
  "sphinx>=7.0",
  "myst_parser>=0.13",
  "sphinx_copybutton",
  "sphinx_autodoc_typehints",
  "furo>=2023.08.17",
]

[project.urls]
Homepage = "https://code.agibot.com/ai-platform/videodataset"
"Bug Tracker" = "https://code.agibot.com/ai-platform/videodataset/-/issues"
Changelog = "https://code.agibot.com/ai-platform/videodataset/-/releases"

[tool.scikit-build]
minimum-version = "0.9"
build-dir = "build/{wheel_tag}"
cmake.verbose = false
logging.level = "DEBUG"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

[tool.scikit-build.cmake.define]
BUILD_TESTING = "OFF"
CMAKE_BUILD_TYPE = "Release"

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
log_cli_level = "INFO"
testpaths = ["tests"]
norecursedirs = ["benchmark"]

[tool.coverage]
run.source = ["videodataset"]
report.exclude_also = ['\.\.\.', 'if typing.TYPE_CHECKING:']

[tool.mypy]
disable_error_code = ["import-untyped", "operator", "assignment"]
exclude = ["tests/testdata/model", "src/videodataset/_decoder.pyi"]

#  TODO fix mypy errors under the main module videodataset
# [[tool.mypy.overrides]]
# module = "videodataset.*"
# disallow_untyped_defs = true
# disallow_incomplete_defs = true

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
# TODO fix ruff erros from more rules
# extend-select = [
#   "B",   # flake8-bugbear
#   "I",   # isort
#   "ARG", # flake8-unused-arguments
#   "C4",  # flake8-comprehensions
#   "EM",  # flake8-errmsg
#   "ICN", # flake8-import-conventions
#   "G",   # flake8-logging-format
#   "PGH", # pygrep-hooks
#   "PIE", # flake8-pie
#   "PL",  # pylint
#   "PT",  # flake8-pytest-style
#   "PTH", # flake8-use-pathlib
#   "RET", # flake8-return
#   "RUF", # Ruff-specific
#   "SIM", # flake8-simplify
#   "T20", # flake8-print
#   "UP",  # pyupgrade
#   "YTT", # flake8-2020
#   "EXE", # flake8-executable
#   "NPY", # NumPy specific rules
#   "PD",  # pandas-vet
# ]
ignore = [
  "PLR09",   # Too many <...>
  "PLR2004", # Magic value used in comparison
  "ISC001",  # Conflicts with formatter
]
isort.required-imports = ["from __future__ import annotations"]
# Uncomment if using a _compat.typing backport
# typing-modules = ["videodataset._compat.typing"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"src/videodataset/_decoder.pyi" = ["F821"]
