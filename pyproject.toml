[build-system]
requires = [
  "scikit-build-core"
]
build-backend = "scikit_build_core.build"

[project]
name = "videodataset"
dynamic = ["version"]
dependencies = ["numpy==1.26.4"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.scikit-build]
wheel.install-dir = "videodataset/video_decoder"
cmake.args = [
  "-DCMAKE_LIBRARY_OUTPUT_DIRECTORY={CMAKE_INSTALL_PREFIX}/videodataset/video_decoder"
]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

[tool.mypy]
disable_error_code = ["import-untyped", "operator", "assignment"]
exclude = 'tests/testdata/model'
